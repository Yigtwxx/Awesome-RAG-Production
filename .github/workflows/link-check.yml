name: Weekly Link Checker

on:
  schedule:
    # Every Monday at 06:00 UTC (synchronized with discovery workflow).
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Check all markdown files; shared config lives in lychee.toml.
          args: >-
            --config lychee.toml
            --verbose
            --no-progress
            '*.md' '**/*.md'
          # Broken links are reported but do not fail the workflow — curated lists
          # accumulate external rot over time; failures here are signal, not gate.
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
