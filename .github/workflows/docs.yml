name: Deploy Docs (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Cairo/Pillow native libs required by the mkdocs-material `social` plugin
      # to render Open Graph / Twitter card images.
      - name: Install Cairo/Pillow system libs (social cards)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev pngquant

      - name: Install Dependencies
        run: pip install -r docs-site/requirements.txt

      - name: Stage Docs
        run: bash docs-site/stage_docs.sh

      - name: Build Site
        run: mkdocs build -f docs-site/mkdocs.yml --verbose

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/site

  deploy:
    needs: build
    # PRs build the site but never publish it. Guarding on `github.ref` alone was
    # not enough: a run that leaves the queue after its PR has merged no longer
    # resolves `refs/pull/N/merge` and the job fails instead of skipping, which
    # is how a red `deploy` check landed on an already-merged PR during the
    # 2026-08-26 Actions incident. `workflow_dispatch` stays able to deploy so a
    # missed push run can still be replayed by hand.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://yigtwxx.github.io/awesome-rag-production/
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
